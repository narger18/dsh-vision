name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.19.0, 20.18.0, 18.20.0]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build verification
        run: pnpm build

  integration:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Integration test — vision provider resolution
        run: npx vitest run tests/vision-provider.test.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Integration test — image generation config
        run: npx vitest run tests/content.test.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}

      - name: Integration test — video generation config
        run: npx vitest run tests/harness-vision.test.ts
        env:
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          PIKA_API_KEY: ${{ secrets.PIKA_API_KEY }}

      - name: Integration test — client settings
        run: npx vitest run tests/client-settings.test.ts tests/settings-slot.test.ts tests/see-config.test.ts
